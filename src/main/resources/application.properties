quarkus.application.name=ga4gh-visa-issuer
quarkus.http.port=8080
quarkus.package.jar.type=fast-jar

# Issuer URL: the claim iss of every Visa and the base of the jku header. Verifiers must reach this URL.
visa-issuer.issuer=${VISA_ISSUER_URL:http://localhost:8080}
visa-issuer.visa-lifetime-seconds=${VISA_LIFETIME_SECONDS:3600}
visa-issuer.grants-file=${VISA_GRANTS_FILE:}

# The verification harness trusts one issuer and fetches its key set from the given URL.
visa-verifier.trusted-issuer=${visa-issuer.issuer}
visa-verifier.jwks-uri=${VISA_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
visa-verifier.accepted-by=dac
visa-verifier.trusted-sources=${VISA_TRUSTED_SOURCES:}
